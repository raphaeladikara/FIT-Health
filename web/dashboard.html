<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VECTRA-X analytics dashboard and decision-support evidence.">
  <title>Analytics dashboard | VECTRA-X</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/dashboard.css">
  <link rel="stylesheet" href="assets/responsive.css">
</head>
<body class="dashboard-page">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="dashboard-shell">
    <aside class="sidebar" id="sidebar" aria-label="Dashboard navigation">
      <div class="sidebar-head">
        <a class="brand" href="index.html"><span class="brand-mark">VX</span><span><strong>VECTRA-X</strong><small>Evidence console</small></span></a>
        <button class="icon-button sidebar-close" id="close-menu" aria-label="Close menu">×</button>
      </div>
      <nav id="dashboard-nav"></nav>
      <div class="sidebar-foot"><strong>Decision support only</strong><p>Pre-lab evidence leads. Target-restating fields are excluded from public evidence.</p><a href="demo.html">Open guided demo</a></div>
    </aside>
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <main id="main" class="dashboard-main">
      <header class="dashboard-header">
        <button class="icon-button menu-button" id="open-menu" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">☰</button>
        <div><p id="section-group">Overview</p><h1 id="section-title" tabindex="-1">Executive overview</h1></div>
        <div class="run-summary"><span class="canonical-dot"></span><span><strong id="run-status">Canonical run</strong><small id="run-meta">Loading provenance...</small></span></div>
      </header>
      <div class="model-strip">
        <label for="model-mode">Model mode</label>
        <select id="model-mode">
          <option value="PRE_LAB">PRE_LAB · deployable evidence</option>
          <option value="LAB_AWARE">LAB_AWARE · workflow comparison</option>
        </select>
        <span id="evaluation-source">Held-out test</span>
      </div>
      <div class="route-notice" id="route-notice" role="status" aria-live="polite"></div>
      <section id="dashboard-view" class="dashboard-view" aria-live="polite"></section>
    </main>
  </div>
  <script type="module" src="assets/dashboard.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guided demo | VECTRA-X</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/dashboard.css">
  <link rel="stylesheet" href="assets/responsive.css">
</head>
<body class="demo-page">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="demo-header">
    <a class="brand" href="index.html"><span class="brand-mark">VX</span><span><strong>VECTRA-X</strong><small>Guided demo</small></span></a>
    <div class="demo-header-actions"><span>3-5 min</span><a href="dashboard.html">Open analytics</a></div>
  </header>
  <main id="main" class="demo-shell">
    <aside class="demo-progress" aria-label="Demo progress">
      <p>Guided decision flow</p>
      <ol id="demo-step-list"></ol>
      <button class="button button-quiet" id="restart-demo" type="button">Restart demo</button>
    </aside>
    <section class="demo-workspace" aria-live="polite">
      <div class="demo-meta"><span id="demo-counter">Step 1 of 5</span><span id="demo-case">Choose a scenario</span></div>
      <div id="demo-content"></div>
      <div class="demo-controls">
        <button class="button button-secondary" id="demo-back" type="button">Back</button>
        <button class="button button-primary" id="demo-next" type="button">Continue</button>
      </div>
    </section>
  </main>
  <script type="module" src="assets/demo.js"></script>
</body>
</html>
